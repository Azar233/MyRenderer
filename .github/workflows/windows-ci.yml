name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for GLAD
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GLAD generator dependencies
        run: python -m pip install "Jinja2>=2.7,<4.0"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CPU tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyRenderer-Windows-x64
          path: build/MyRenderer-*.zip
          if-no-files-found: error
